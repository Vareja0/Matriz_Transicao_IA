<!doctype html>
<html lang="pt-BR" data-mode="colaborador">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionário</title>
<style>
/* estilo.css
   Visual pensado para quem não tem familiaridade com tecnologia:
   letras maiores, botões grandes, uma coisa por vez.
   Verde = navegação e ações; amarelo = o que a pessoa preenche (como as células amarelas da planilha). */

:root {
  --bg: #EEF2EF; --surface: #FFFFFF; --ink: #142E27; --muted: #52665D; --line: #D2DCD5;
  --green: #1C5843; --green-2: #2A7457; --green-soft: #E1EDE6; --green-line: #A9CBB8;
  --tag: #EDB92E; --tag-soft: #FFF6D6; --tag-line: #E2C66F;
  --alert: #A8392C; --alert-soft: #F9E5E0; --warn: #7A5700; --warn-soft: #FCF1D4;
  --font: "Avenir Next", "Avenir", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-family: var(--font); color: var(--ink); background: var(--bg);
  font-size: 16.5px; line-height: 1.55;
}
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px }
[hidden] { display: none !important }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 14.5px }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 270px 1fr; min-height: 100vh }
.side { background: var(--green); color: #EEF6F1; padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto }
.brand { padding: 0 10px }
.brand small { display: block; color: #B7D5C4; font-size: 13px }
.brand strong { display: block; font-size: 20px; line-height: 1.25; margin-top: 3px }
.nav { display: flex; flex-direction: column; gap: 3px }
.nav button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: #E6F1EA; font-weight: 600; line-height: 1.25 }
.nav button:hover { background: rgba(255,255,255,.08) }
.nav button:focus-visible { outline: 3px solid var(--tag) }
.nav button[aria-current="page"] { background: #F6F9F7; color: var(--green) }
.nav .mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 13px; font-weight: 800; position: relative }
.nav .mark.done { background: var(--tag); border-color: var(--tag); color: var(--ink) }
.nav .mark.pend::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #F08A7A; border: 2px solid var(--green) }
.nav button[aria-current="page"] .mark.pend::after { border-color: #F6F9F7 }
.nav .sep { height: 1px; background: rgba(255,255,255,.16); margin: 8px 6px }
.side-foot { margin-top: auto; font-size: 14.5px }
.side-foot details summary { cursor: pointer; padding: 8px 12px; border-radius: 8px; color: #D9EBE0; list-style: none }
.side-foot details summary::-webkit-details-marker { display: none }
.side-foot details summary::before { content: "⋯  " }
.side-foot details summary:hover { background: rgba(255,255,255,.08) }
.side-foot .menu { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 0 }
.side-foot .menu button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; color: #E6F1EA }
.side-foot .menu button:hover { background: rgba(255,255,255,.08) }
.side-foot .menu button:focus-visible { outline: 3px solid var(--tag) }
.saved { padding: 8px 12px 0; color: #A9C9B8; font-size: 13px }

main { padding: 36px 44px 90px; width: 100%; max-width: 1100px; min-width: 0 }
main:focus { outline: none }
.head { margin-bottom: 24px; max-width: 760px }
.head h1 { font-size: 31px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.02em }
.head p { margin: 0; color: var(--muted); font-size: 17px }
h2 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em }
h3 { font-size: 17px; margin: 0 0 4px }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 68ch }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 26px; margin: 0 0 18px }
.section-title { margin: 30px 0 12px }

/* ---------- botões ---------- */
.btn { border: 0; border-radius: 10px; padding: 12px 20px; min-height: 46px; font-weight: 700; cursor: pointer; background: var(--green); color: #fff; display: inline-flex; align-items: center; gap: 8px; text-decoration: none }
.btn:hover { background: var(--green-2) }
.btn.big { font-size: 18px; padding: 15px 26px; min-height: 56px }
.btn.light { background: var(--surface); color: var(--green); border: 2px solid var(--green-line) }
.btn.light:hover { background: var(--green-soft); border-color: var(--green) }
.btn.quiet { background: transparent; color: var(--green); padding: 8px 12px; min-height: 40px; text-decoration: underline; text-underline-offset: 3px }
.btn.quiet:hover { background: var(--green-soft) }
.btn.danger { background: transparent; color: var(--alert); padding: 8px 12px; min-height: 40px }
.btn.danger:hover { background: var(--alert-soft) }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }

/* ---------- campos ---------- */
.field { margin: 0 0 20px }
.field > label, .field > .q { display: block; font-weight: 700; margin-bottom: 7px; font-size: 16.5px }
.field .hint { display: block; color: var(--muted); font-size: 14.5px; margin: -3px 0 8px; font-weight: 400 }
.in { width: 100%; max-width: 460px; padding: 11px 13px; border-radius: 9px; background: var(--tag-soft); border: 1.5px solid var(--tag-line); border-bottom: 3px solid var(--tag) }
.in:hover { border-color: var(--tag) }
.in.bad, .bad .in { background: var(--alert-soft); border-color: #E2A79D; border-bottom-color: var(--alert) }
select.in { cursor: pointer }
textarea.in { min-height: 70px; resize: vertical }

/* escolhas em botões (rádio) */
.choices { display: flex; flex-wrap: wrap; gap: 8px }
.choices.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)) }
.choice { position: relative }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; pointer-events: none }
.choice span { display: block; padding: 10px 15px; border-radius: 10px; background: var(--tag-soft); border: 1.5px solid var(--tag-line); cursor: pointer; font-weight: 650; min-height: 46px; line-height: 1.3 }
.choice span small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; margin-top: 2px }
.choice:hover span { border-color: var(--tag) }
.choice input:checked + span { background: var(--green); border-color: var(--green); color: #fff }
.choice input:checked + span small { color: #D5EADF }
.choice input:checked + span::before { content: "✓ " }
.choice input:focus-visible + span { outline: 3px solid var(--tag); outline-offset: 2px }
.field.missing .choices .choice span { border-color: #E2A79D; background: var(--alert-soft) }
.field.missing > .q::after { content: "  ← falta responder"; color: var(--alert); font-weight: 700; font-size: 14px }

/* contador com − e + */
.stepper { display: inline-flex; align-items: stretch; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--tag-line); border-bottom: 3px solid var(--tag); background: var(--tag-soft) }
.stepper button { border: 0; background: transparent; width: 50px; font-size: 22px; font-weight: 700; cursor: pointer; color: var(--green) }
.stepper button:hover { background: #FBEBB4 }
.stepper input { border: 0; background: transparent; width: 110px; text-align: center; font-weight: 700; font-size: 18px; padding: 10px 0 }
.stepper .unit { align-self: center; padding-right: 14px; color: var(--muted); font-size: 14.5px }

/* ---------- cartões ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px }
.card.warn { border-color: #E9B7AE; box-shadow: inset 4px 0 0 var(--alert) }
.card h3 { font-size: 19px; margin: 0 }
.card .role { color: var(--muted); margin-top: -6px }
.card .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px }
.status { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; font-weight: 600 }
.status::before { content: ""; flex: 0 0 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: currentColor }
.status.ok { color: var(--green) }
.status.err { color: var(--alert) }
.status.info { color: var(--warn) }
.pill { display: inline-block; font-size: 13.5px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: var(--green-soft); color: var(--green) }
.pill.yellow { background: var(--tag-soft); color: var(--warn); border: 1px solid var(--tag-line) }
.skills { display: grid; gap: 5px; font-size: 14.5px }
.skills div { display: flex; justify-content: space-between; gap: 10px }
.dots { letter-spacing: 3px; color: var(--green); white-space: nowrap }
.dots i { font-style: normal; color: #C9D6CE }
.empty { text-align: center; padding: 40px 24px; color: var(--muted); background: var(--surface); border: 2px dashed var(--line); border-radius: 14px }
.empty p { margin: 0 0 16px; font-size: 17px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chips button { border: 1.5px dashed var(--green-line); background: var(--surface); color: var(--green); border-radius: 20px; padding: 7px 14px; cursor: pointer; font-weight: 600 }
.chips button:hover { background: var(--green-soft); border-style: solid }

/* ---------- início ---------- */
.journey { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px }
.journey li { display: grid; grid-template-columns: 52px 1fr auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px }
.journey li.next { border: 2px solid var(--green); box-shadow: 0 4px 16px rgba(28,88,67,.12) }
.journey .mark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; border: 2px solid var(--green-line); color: var(--green) }
.journey .mark.done { background: var(--tag); border-color: var(--tag); color: var(--ink) }
.journey h3 { margin: 0 }
.journey p { margin: 2px 0 0; color: var(--muted); font-size: 15px }
.journey .state { font-size: 14.5px; font-weight: 700; margin-top: 4px }
.journey .state.err { color: var(--alert) }
.journey .state.ok { color: var(--green) }
.hello { font-size: 18px; max-width: 64ch; margin: 0 0 22px }

/* ---------- avisos ---------- */
.banner { display: flex; gap: 14px; align-items: flex-start; border-radius: 12px; padding: 15px 18px; margin: 0 0 20px; font-weight: 600; font-size: 16.5px }
.banner.ok { background: var(--green-soft); color: var(--green) }
.banner.aviso { background: var(--warn-soft); color: var(--warn) }
.banner.erro { background: var(--alert-soft); color: var(--alert) }
.banner .ico { font-size: 20px; line-height: 1.2 }
.banner .more { font-weight: 500; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 14px }
.banner a, .banner button.link { color: inherit; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }
.example-bar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; background: var(--tag-soft); border: 1.5px solid var(--tag-line); border-radius: 12px; padding: 14px 18px; margin: 0 0 22px }

/* ---------- plano ---------- */
.capacity { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 22px }
.cap-row { display: grid; grid-template-columns: 220px 1fr 140px; gap: 16px; align-items: center; margin: 12px 0 }
.cap-row .t { font-weight: 700; font-size: 15px }
.cap-row .v { font-size: 15px; color: var(--muted); text-align: right }
.cap-row .v b { color: var(--ink) }
.bar { display: flex; height: 48px; border-radius: 9px; overflow: hidden; background: repeating-linear-gradient(135deg, #F1F4F2 0 7px, #E5EBE7 7px 14px); border: 1px solid var(--line) }
.bar .seg { display: flex; flex-direction: column; justify-content: center; padding: 0 10px; color: #fff; font-size: 13px; line-height: 1.25; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--surface); min-width: 0 }
.bar .seg.c0 { background: var(--green) } .bar .seg.c1 { background: var(--green-2) } .bar .seg.c2 { background: #4E8F72 } .bar .seg.c3 { background: #3F6F5D }
.bar .seg.cult { background: var(--tag); color: var(--ink) }
.bar.thin { height: 16px }
.slots { display: flex; gap: 7px; flex-wrap: wrap }
.slots i { width: 34px; height: 26px; border-radius: 6px; border: 2px solid var(--green); background: var(--surface) }
.slots i.on { background: var(--green) }
.slots i.cult { background: var(--tag); border-color: var(--tag) }
.facts { display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 8px }
.facts div { color: var(--muted); font-size: 15px }
.facts b { display: block; color: var(--ink); font-size: 22px }
.action { display: grid; grid-template-columns: 46px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin: 0 0 12px }
.action .n { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px }
.action.later .n { background: #C9D6CE; color: var(--ink) }
.action.prep .n { background: var(--tag); color: var(--ink) }
.action h3 { font-size: 18px; margin: 0 }
.action .what { font-weight: 700; color: var(--green); margin: 2px 0 }
.action .desc { color: var(--muted); margin: 0 0 8px; font-size: 15px }
.action dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 18px; margin: 8px 0 10px; font-size: 15px }
.action dt { color: var(--muted); font-size: 13.5px }
.action dd { margin: 0; font-weight: 650 }
.action .next { background: var(--green-soft); border-radius: 9px; padding: 9px 12px; font-size: 15px; margin: 4px 0 10px }
.action.later .next { background: var(--warn-soft); color: var(--warn); font-weight: 650 }
.action .extra { font-size: 14.5px; color: var(--warn); margin: 0 0 8px }
.action .choices .choice span { min-height: 40px; padding: 7px 13px; font-size: 15px }

/* ---------- janelas ---------- */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); color: var(--ink); box-shadow: 0 20px 60px rgba(10,30,24,.35) }
dialog::backdrop { background: rgba(14,36,29,.55) }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 32px) }
.dlg-head { padding: 22px 28px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start }
.dlg-head h2 { font-size: 23px; margin: 0 }
.dlg-head p { margin: 4px 0 0; color: var(--muted) }
.dlg-x { border: 0; background: transparent; font-size: 28px; line-height: 1; cursor: pointer; color: var(--muted); padding: 2px 8px; border-radius: 8px }
.dlg-x:hover { background: var(--bg) }
.dlg-body { padding: 22px 28px; overflow: auto }
.dlg-foot { padding: 16px 28px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; background: #F7FAF8; border-radius: 0 0 16px 16px }
.dlg-msg { color: var(--alert); font-weight: 700; margin-right: auto; align-self: center }
.group-title { font-size: 15px; font-weight: 800; color: var(--green); margin: 8px 0 14px; padding-top: 14px; border-top: 1px dashed var(--line) }
.group-title:first-child { border-top: 0; padding-top: 0 }
.preview { background: var(--green-soft); border-radius: 10px; padding: 12px 15px; margin: 4px 0 18px; font-size: 15.5px }

/* ---------- questionário ---------- */
.privacy { border-left: 4px solid var(--green-line); background: var(--green-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 15px; margin: 0 0 20px; max-width: 72ch }
.result-band { font-size: 26px; font-weight: 800; margin: 4px 0 }
.solo { max-width: 820px; margin: 0 auto; padding: 40px 22px 80px }
.solo .block { padding: 26px 28px }

.toast { position: fixed; right: 22px; bottom: 22px; background: var(--ink); color: #fff; padding: 13px 18px; border-radius: 10px; font-size: 15.5px; box-shadow: 0 6px 20px rgba(21,48,42,.3); max-width: 420px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 20 }
.toast.show { opacity: 1; transform: none }

/* ---------- avançado ---------- */
details.advanced { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0; margin: 0 0 18px }
details.advanced > summary { cursor: pointer; padding: 18px 26px; font-weight: 700; color: var(--green) }
details.advanced[open] > summary { border-bottom: 1px solid var(--line) }
details.advanced .inner { padding: 20px 26px }
table { border-collapse: collapse; width: 100%; font-size: 15px }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #E5EBE7; vertical-align: middle }
th { font-size: 13.5px; color: var(--muted) }
td .in { max-width: 120px; padding: 7px 9px }
.scroll { overflow-x: auto }
.help-list { margin: 0; padding-left: 20px }
.help-list li { margin: 6px 0 }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr }
  .side { position: static; height: auto; padding: 14px 12px; gap: 10px }
  .brand { padding: 0 4px }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px }
  .nav button { grid-template-columns: 28px auto; white-space: nowrap }
  .nav .sep { display: none }
  .side-foot { margin-top: 0 }
  main { padding: 22px 16px 70px }
  .head h1 { font-size: 26px }
  .journey li { grid-template-columns: 44px 1fr; }
  .journey li .btn { grid-column: 1 / -1 }
  .cap-row { grid-template-columns: 1fr; gap: 6px }
  .cap-row .v { text-align: left }
  .action { grid-template-columns: 1fr }
  dialog { width: 100vw; max-height: 100vh; border-radius: 0; margin: 0 }
  .dlg { max-height: 100vh }
  .dlg-body, .dlg-head, .dlg-foot { padding-left: 18px; padding-right: 18px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
@media print {
  body { background: #fff; font-size: 12px }
  .side, .no-print, .btn, .actions, .choices, .toast { display: none !important }
  .app { display: block }
  main { padding: 0; max-width: none }
  .action, .capacity, .block { break-inside: avoid; border: 1px solid #bbb }
  .bar .seg, .slots i, .action .n { -webkit-print-color-adjust: exact; print-color-adjust: exact }
}

/* usado na página de testes */
.chip { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 20px }
.chip.ok { background: var(--green-soft); color: var(--green) }
.chip.err { background: var(--alert-soft); color: var(--alert) }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
// motor.js
// Toda a lógica de cálculo. Versão 2 das regras: parte das fórmulas da planilha Matriz_Transicao_IA_v1.xlsx
// e muda o que os testes de sentido apontaram (ver diagnostico.txt, Parte 3). Mudanças marcadas com [v2-n].
// Não depende da interface: pode ser testado sozinho (veja testes/Executar_Testes.html).

const COMPS = [
  ['C01', 'Usar IA e formular instruções', 'Digitais e de dados'],
  ['C02', 'Conferir resultados e decidir', 'Cognitivas complexas'],
  ['C03', 'Organizar dados e estoque', 'Digitais e de dados'],
  ['C04', 'Atender com empatia e adaptar-se', 'Socioemocionais e adaptação'],
  ['C05', 'Revisar e criar conteúdo', 'Cognitivas complexas'],
  ['C06', 'Conduzir mudança e orientar equipe', 'Liderança']
];
// [v2-7] EXT (apoio externo) e [v2-8] MAT (maturidade digital da loja) entram no catálogo
const INTERV_CODES = ['CULT', 'PARES', 'EXP', 'TUTOR', 'RED', 'PRES', 'EXT', 'MAT'];
const TASK_Q = ['ativa', 'q1', 'q2', 'q3', 'q4', 'q5', 'r1', 'r2', 'r3'];
const ANDAMENTOS = ['Não iniciada', 'Em andamento', 'Concluída'];
const PRONTIDOES = ['Baixa', 'Moderada', 'Alta'];
const MATURIDADE_ITENS = ['Registros digitais organizados', 'Equipamentos e acesso disponíveis', 'Rotinas de conferência de dados', 'Apoio à aprendizagem na rotina'];
const EPS = 1e-9;

const isNum = x => typeof x === 'number' && Number.isFinite(x);
const filled = x => x !== undefined && x !== null && String(x).trim() !== '';
const up = s => String(s).trim().toUpperCase();
// [v2-13] compara códigos pelo número (D9 < D10 < D100), não pelo texto
const idNum = id => { const m = /(\d+)/.exec(String(id || '')); return m ? +m[1] : 0; };
const cmpId = (a, b) => idNum(a) - idNum(b) || (up(a) < up(b) ? -1 : up(a) > up(b) ? 1 : 0);

// ---------- dados de exemplo (Mercado Aurora, fictício) ----------
function exemploAurora() {
  return {
    versao: '2.0',
    negocio: {
      loja: 'Mercado Aurora (simulado)', segmento: 'Minimercado de bairro', dataBase: '2026-09-22',
      horas: 3, orcamento: 80, maxAcoes: 3,
      maturidade: [1, 1, 2, 2],
      riscoAlto: 2, prontBaixa: 1, prontAlta: 2, presHoras: 0.5,
      maxAprendizes: 2,            // [v2-9] aprendizes simultâneos por colega
      cultGrupo: 'Sim',            // [v2-10] preparação cultural em grupo
      cultHoraExtra: 0.25,         // [v2-10] horas a mais por pessoa extra no grupo
      matAndamento: 'Não iniciada',
      intervencoes: {
        CULT: { nome: 'Preparação cultural', horas: 1, semanas: 2, custo: 0, participantes: 'Pessoa(s) + colega', compartilhado: false },

function estadoVazio() {
  const s = exemploAurora();
  s.negocio.loja = ''; s.negocio.segmento = '';
  s.negocio.dataBase = new Date().toISOString().slice(0, 10);
  s.equipe = []; s.tarefas = []; s.diagnosticos = [];
  return s;
}

function addDays(iso, n) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

// ---------- Negocio!B46: validação dos parâmetros ----------
function validarNegocio(N) {
  const e = [];
  const base = [N.horas, N.orcamento, N.maxAcoes];
  if (!base.every(isNum)) e.push('Preencha horas semanais, orçamento e máximo de ações.');
  else {
    if (Math.min(...base) < 0) e.push('Horas, orçamento e máximo de ações não podem ser negativos.');
    if (!Number.isInteger(N.maxAcoes)) e.push('O máximo de ações simultâneas deve ser um número inteiro.');
  }
  if (!N.maturidade.every(isNum)) e.push('Responda os quatro itens de maturidade digital.');
  else if (N.maturidade.some(x => x < 0 || x > 3)) e.push('Maturidade digital vai de 0 a 3.');
  if (![N.riscoAlto, N.prontBaixa, N.prontAlta, N.presHoras].every(isNum)) e.push('Preencha os limites de risco, prontidão e preservação.');
  else {
    if (N.riscoAlto < 1 || N.riscoAlto > 3) e.push('O limite de risco alto deve ficar entre 1 e 3.');
    if (N.prontBaixa < 0) e.push('O limite de prontidão baixa não pode ser negativo.');
    if (N.prontAlta <= N.prontBaixa) e.push('O limite de prontidão alta deve ser maior que o de prontidão baixa.');
    if (N.prontAlta > 3) e.push('O limite de prontidão alta não pode passar de 3.');
    if (N.presHoras < 0) e.push('As horas de preservação não podem ser negativas.');
  }
  if (!isNum(N.maxAprendizes) || !Number.isInteger(N.maxAprendizes) || N.maxAprendizes < 1) e.push('Aprendizes por colega: número inteiro a partir de 1.');
  if (N.cultGrupo !== 'Sim' && N.cultGrupo !== 'Não') e.push('Indique se a preparação cultural é feita em grupo.');
  if (!isNum(N.cultHoraExtra) || N.cultHoraExtra < 0) e.push('Horas extras por pessoa na preparação em grupo: número a partir de 0.');
  for (const k of INTERV_CODES) {
    const it = N.intervencoes[k];
    if (![it.horas, it.semanas, it.custo].every(isNum)) { e.push(`Preencha horas, semanas e custo de “${it.nome}”.`); continue; }
    if (Math.min(it.horas, it.semanas, it.custo) < 0) e.push(`“${it.nome}” tem valor negativo.`);
    if (it.semanas < 1 || it.semanas > 12) e.push(`A duração de “${it.nome}” deve ficar entre 1 e 12 semanas.`);
  }
  return e;
}

// [v2-6] intervenções compatíveis para uma necessidade técnica (pessoa × competência).
// Prontidão moderada prefere ações acompanhadas; mentoria por IA só para prontidão alta e quem já usa IA (C01 ≥ 1).
// [v2-7] apoio externo é o último recurso: só quando nenhuma opção interna é compatível.
const ORDEM_EMPATE = ['PARES', 'RED', 'EXP', 'TUTOR'];
function escolherIntervencao(a, IV, semColega) {
  const W = semColega ? 0 : a.colegas.length, U = a.lacuna;
  const compat = [];
  if (W > 0) compat.push('PARES');
  if (a.automacao) compat.push('RED');
  if (U >= 2 || a.prontidao === 'Moderada') compat.push('EXP');
  if ((U === 1 || W === 0) && a.prontidao === 'Alta' && a.nivelIA >= 1) compat.push('TUTOR');
  if (!compat.length) return 'EXT';
  const min = Math.min(...compat.map(k => IV[k].custo));
  return ORDEM_EMPATE.find(k => compat.includes(k) && IV[k].custo === min);
}

// ---------- cálculo completo: Equipe, Tarefas, Diagnostico e Plano ----------
function compute(S) {
  const N = S.negocio;
  const negErros = validarNegocio(N);
  const negOK = negErros.length === 0;
  const matOK = N.maturidade.every(isNum);
  const matMedia = matOK ? N.maturidade.reduce((a, b) => a + b, 0) / 4 : null;          // Negocio!B19
  const teto = matOK ? (matMedia < 1 ? 1 : matMedia < 2 ? 2 : 3) : null;                 // Negocio!B20
  const IV = N.intervencoes;
  const idCount = (list, id) => list.filter(x => filled(x.id) && up(x.id) === up(id)).length;

  // Equipe!L (situação do cadastro)
  const equipe = S.equipe.map(p => {
    const vazio = ![p.id, p.nome, p.funcao, p.gestor, p.prontidao].some(filled) && !p.c.some(isNum);
    const erros = [];
    if (!vazio) {
      if (!filled(p.id)) erros.push('Informe o código.');
      else if (idCount(S.equipe, p.id) !== 1) erros.push('Código repetido.');
      if (!filled(p.nome)) erros.push('Informe o nome.');
      if (!filled(p.funcao)) erros.push('Informe a função.');
      if (p.gestor !== 'Sim' && p.gestor !== 'Não') erros.push('Indique se é gestor.');
      if (!PRONTIDOES.includes(p.prontidao)) erros.push('Indique a faixa de prontidão.');
      if (!p.c.every(isNum)) erros.push('Preencha as seis competências.');
      else if (p.c.some(x => x < 0 || x > 3)) erros.push('Competências vão de 0 a 3.');
    }
    return { ...p, vazio, erros, ok: !vazio && erros.length === 0 };
  });
  const pessoaOK = id => equipe.filter(p => p.ok && up(p.id) === up(id));

  // Tarefas!L:O (risco, classe inicial, classe final, situação)
  const tarefas = S.tarefas.map(t => {
    const vazio = ![t.id, t.nome, ...TASK_Q.map(k => t[k])].some(filled);
    const erros = [];
    if (!vazio) {
      if (!filled(t.id)) erros.push('Informe o código.');
      else if (idCount(S.tarefas, t.id) !== 1) erros.push('Código repetido.');
      if (!filled(t.nome)) erros.push('Descreva a tarefa.');
      if (TASK_Q.some(k => t[k] !== 'Sim' && t[k] !== 'Não')) erros.push('Responda Sim ou Não em todas as perguntas.');
    }
    const ok = !vazio && erros.length === 0;
    let risco = null, inicial = null, final = null;
    if (ok) {
      risco = (t.r1 === 'Sim' ? 1 : 0) + (t.r2 === 'Sim' ? 1 : 0) + (t.r3 === 'Não' ? 1 : 0);
      inicial = (t.q1 === 'Sim' || t.q2 === 'Sim') ? 'Humana'
        : (t.q3 === 'Sim' && t.q4 === 'Sim') ? 'Automação'
        : t.q5 === 'Sim' ? 'Colaboração' : 'Aumento';
      final = (inicial === 'Automação' && isNum(N.riscoAlto) && risco >= N.riscoAlto) ? 'Aumento' : inicial;
    }
    return { ...t, vazio, erros, ok, risco, inicial, final };
  });
  const tarefaOK = id => tarefas.filter(t => t.ok && up(t.id) === up(id));

  // Diagnostico!I:W — campos por diagnóstico
  const diags = S.diagnosticos.map(d => {
    const vazio = ![d.id, d.pessoa, d.tarefa, d.comp, d.andamento].some(filled) && !isNum(d.meta) && !isNum(d.crit);
    const erros = [];
    if (!vazio) {
      if (!filled(d.id)) erros.push('Informe o código.');
      else if (idCount(S.diagnosticos, d.id) !== 1) erros.push('Código repetido.');
      if (!filled(d.pessoa)) erros.push('Escolha a pessoa.');
      else if (pessoaOK(d.pessoa).length !== 1) erros.push('Pessoa inexistente ou com cadastro incompleto.');
      if (!filled(d.tarefa)) erros.push('Escolha a tarefa.');
      else if (tarefaOK(d.tarefa).length !== 1) erros.push('Tarefa inexistente ou incompleta.');
      if (!COMPS.some(c => c[0] === d.comp)) erros.push('Escolha a competência.');
      if (!isNum(d.meta) || d.meta < 0 || d.meta > 3) erros.push('Meta futura de 0 a 3.');
      if (!isNum(d.crit) || d.crit < 1 || d.crit > 3) erros.push('Criticidade de 1 a 3.');
      if (!ANDAMENTOS.includes(d.andamento)) erros.push('Escolha o andamento.');
      if (filled(d.pessoa) && filled(d.tarefa) && filled(d.comp) &&
        S.diagnosticos.filter(x => up(x.pessoa) === up(d.pessoa) && up(x.tarefa) === up(d.tarefa) && x.comp === d.comp).length !== 1)
        erros.push('Combinação pessoa + tarefa + competência repetida.');
      if (!negOK) erros.push('Corrija os parâmetros do Negócio.');
    }
    const ok = !vazio && erros.length === 0;
    const r = { ...d, vazio, erros, ok, X: '', nec: '' };
    if (!ok) { r.justificativa = vazio ? '' : 'Corrigir os campos de entrada'; return r; }

    const p = pessoaOK(d.pessoa)[0], t = tarefaOK(d.tarefa)[0];
    const ci = COMPS.findIndex(c => c[0] === d.comp);
    Object.assign(r, {
      pessoaId: p.id, pessoaNome: p.nome, gestor: p.gestor, tarefaNome: t.nome, compNome: COMPS[ci][1], ci,
      classe: t.final, risco: t.risco, prontidao: p.prontidao, nivel: p.c[ci], teto,
      ativa: t.ativa === 'Sim'
    });
    r.metaCiclo = Math.min(d.meta, teto);                       // S
    r.lacunaFutura = Math.max(0, d.meta - r.nivel);             // T
    r.lacunaCiclo = Math.max(0, r.metaCiclo - r.nivel);         // U
    r.prioridade = r.lacunaCiclo * d.crit;                      // V
    r.colegas = equipe.filter(o => o.ok && up(o.id) !== up(d.pessoa) && o.prontidao !== 'Baixa' && o.c[ci] === 3); // W
    r.preservacao = (r.classe !== 'Humana' && r.risco >= N.riscoAlto) ? 'Registrar e praticar sem IA' : '';       // Z
    r.bloqueadoMat = r.metaCiclo < d.meta && r.lacunaCiclo === 0 && r.lacunaFutura > 0;  // [v2-8] só o teto impede a ação
    r.relevante = !(r.classe === 'Humana' || !r.ativa || d.andamento === 'Concluída');
    // Necessidade do diagnóstico. [v2-2] prontidão baixa só gera preparação quando há lacuna;
    // sem lacuna e com risco alto, a ação é preservação.
    if (r.relevante) {
      if (r.lacunaCiclo > 0) r.nec = p.prontidao === 'Baixa' ? 'CULT' : 'TEC';
      else if (r.preservacao) r.nec = 'PRES';
    }
    return r;
  });

  // ---------- [v2-1] ações agrupadas ----------
  const acoes = [];
  const validos = diags.filter(d => d.ok);
  const porId = id => S.equipe.find(p => up(p.id) === up(id));
  const ordemDiag = (a, b) => cmpId(a.id, b.id);

  // Treino técnico: uma ação por pessoa × competência (as tarefas viram contexto de prática)
  const grupos = new Map();
  for (const d of validos.filter(d => d.nec === 'TEC').sort(ordemDiag)) {
    const k = up(d.pessoaId) + '|' + d.comp;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(d);
  }
  for (const ds of grupos.values()) {
    const f = ds[0], p = equipe.find(o => up(o.id) === up(f.pessoaId));
    const a = {
      tipo: 'TEC', id: f.id, ids: ds.map(d => d.id), pessoa: f.pessoaId, pessoas: [f.pessoaId], pessoaNome: f.pessoaNome,
      gestor: f.gestor === 'Sim', comp: f.comp, compNome: f.compNome, tarefaNome: ds.map(d => d.tarefaNome).join(' · '),
      lacuna: Math.max(...ds.map(d => d.lacunaCiclo)), crit: Math.max(...ds.map(d => d.crit)),
      prioridade: Math.max(...ds.map(d => d.prioridade)), risco: Math.max(...ds.map(d => d.risco)),
      preservacao: ds.some(d => d.preservacao) ? 'Registrar e praticar sem IA' : '',
      automacao: ds.some(d => d.classe === 'Automação'), colegas: f.colegas, prontidao: p.prontidao, nivelIA: p.c[0],
      metaGradual: ds.some(d => d.metaCiclo < d.meta),
      andamento: ds.some(d => d.andamento === 'Em andamento') ? 'Em andamento' : 'Não iniciada'
    };
    a.X = escolherIntervencao(a, IV, false);
    if (a.X === 'PARES') a.alternativa = escolherIntervencao(a, IV, true);
    acoes.push(a);
  }

  // [v2-1][v2-10] Preparação cultural: uma por pessoa; em grupo quando houver duas ou mais
  const aguardando = [];
  const precisaPrep = new Map();
  for (const d of validos.filter(d => d.nec === 'CULT').sort(ordemDiag)) {
    const k = up(d.pessoaId);
    if (!precisaPrep.has(k)) precisaPrep.set(k, []);
    precisaPrep.get(k).push(d);
  }
  const prepFeita = [], prepFazer = [];
  for (const [k, ds] of precisaPrep) (porId(k).prep === 'Concluída' ? prepFeita : prepFazer).push(ds);
  // [v2-4] preparação concluída e prontidão ainda baixa: aguardar a reaplicação da autoavaliação
  for (const ds of prepFeita) aguardando.push({ pessoa: ds[0].pessoaId, pessoaNome: ds[0].pessoaNome, ids: ds.map(d => d.id) });
  const montarPrep = lista => {
    const ds = lista.flat(), membros = lista.map(l => l[0].pessoaId);
    const facilitadores = equipe.filter(o => o.ok && o.prontidao !== 'Baixa' && !membros.some(m => up(m) === up(o.id)));
    const n = membros.length;
    acoes.push({
      tipo: 'CULT', X: 'CULT', id: ds.map(d => d.id).sort(cmpId)[0], ids: ds.map(d => d.id).sort(cmpId), pessoa: n === 1 ? membros[0] : '', pessoas: membros,
      pessoaNome: lista.map(l => l[0].pessoaNome).join(', '), gestor: ds.some(d => d.gestor === 'Sim'), comp: null, compNome: '',
      tarefaNome: [...new Set(ds.map(d => d.tarefaNome))].join(' · '), prioridade: Math.max(...ds.map(d => d.prioridade)),
      risco: Math.max(...ds.map(d => d.risco)), preservacao: ds.some(d => d.preservacao) ? 'Registrar e praticar sem IA' : '',
      grupo: n > 1, horasExtra: (n - 1) * N.cultHoraExtra, colegas: facilitadores, apoioExterno: facilitadores.length === 0,
      andamento: membros.some(m => porId(m).prep === 'Em andamento') ? 'Em andamento' : 'Não iniciada'
    });
  };
  if (prepFazer.length) {
    if (N.cultGrupo === 'Sim') montarPrep(prepFazer);
    else prepFazer.forEach(l => montarPrep([l]));
  }

  // Preservação sem lacuna: uma por pessoa
  const pres = new Map();
  for (const d of validos.filter(d => d.nec === 'PRES').sort(ordemDiag)) {
    const k = up(d.pessoaId);
    if (!pres.has(k)) pres.set(k, []);
    pres.get(k).push(d);
  }
  for (const ds of pres.values()) {
    const f = ds[0];
    acoes.push({
      tipo: 'PRES', X: 'PRES', id: f.id, ids: ds.map(d => d.id), pessoa: f.pessoaId, pessoas: [f.pessoaId], pessoaNome: f.pessoaNome,
      gestor: f.gestor === 'Sim', comp: f.comp, compNome: f.compNome, tarefaNome: [...new Set(ds.map(d => d.tarefaNome))].join(' · '),
      prioridade: Math.max(...ds.map(d => d.crit)),   // [v2-5] prioridade pela criticidade, não zero
      risco: Math.max(...ds.map(d => d.risco)), preservacao: 'Registrar e praticar sem IA', colegas: [],
      andamento: ds.some(d => d.andamento === 'Em andamento') ? 'Em andamento' : 'Não iniciada'
    });
  }

  // [v2-8] Maturidade digital: ação da loja quando o teto bloqueia alguém por completo (lacuna do ciclo 0,
  // lacuna futura > 0) ou quando o teto é 1 (loja sem base digital)
  const limitados = validos.filter(d => d.relevante && d.metaCiclo < d.meta && (d.bloqueadoMat || teto === 1));
  const focoMat = matOK ? MATURIDADE_ITENS.filter((_, i) => N.maturidade[i] === Math.min(...N.maturidade)) : [];
  if (matOK && teto < 3 && limitados.length && N.matAndamento !== 'Concluída') {
    const gestor = equipe.find(p => p.ok && p.gestor === 'Sim');
    acoes.push({
      tipo: 'MAT', X: 'MAT', id: limitados.map(d => d.id).sort(cmpId)[0], ids: [], pessoa: gestor ? gestor.id : '', pessoas: gestor ? [gestor.id] : [],
      pessoaNome: 'Loja' + (gestor ? ' (' + gestor.nome + ')' : ''), gestor: true, comp: null, compNome: '', tarefaNome: focoMat.join(' · '),
      prioridade: Math.min(9, Math.max(...limitados.map(d => (d.meta - d.metaCiclo) * d.crit))), risco: 0, preservacao: '', colegas: [],
      foco: focoMat, andamento: N.matAndamento === 'Em andamento' ? 'Em andamento' : 'Não iniciada'
    });
  }

  const aplicarIV = a => {
    const iv = IV[a.X];
    a.intervencao = iv.nome;
    a.horas = iv.horas + (a.horasExtra || 0) + (a.preservacao && a.X !== 'PRES' ? N.presHoras : 0) + (a.X === 'PRES' ? N.presHoras : 0);
    a.semanas = Math.max(iv.semanas, a.preservacao ? 4 : 0);
    a.custo = iv.custo;
  };
  acoes.forEach(aplicarIV);

  // [v2-3] Ordem: prioridade; preparação cultural só desempata; depois gestor, risco, custo e código
  acoes.sort((a, b) => b.prioridade - a.prioridade || (b.X === 'CULT') - (a.X === 'CULT') || b.gestor - a.gestor
    || b.risco - a.risco || a.custo - b.custo || cmpId(a.id, b.id));

  // Plano: admissão sequencial por horas, orçamento, vagas e carga dos colegas
  let usoH = 0, usoC = 0, usoN = 0;
  const pagos = new Set(), carga = {};
  const plano = acoes.map((a, i) => {
    // [v2-9] colega com menor carga; se todos estão no limite, usa a intervenção alternativa
    if (a.X === 'PARES') {
      const livre = a.colegas.filter(c => (carga[up(c.id)] || 0) < N.maxAprendizes)
        .sort((x, y) => (carga[up(x.id)] || 0) - (carga[up(y.id)] || 0) || cmpId(x.id, y.id))[0];
      if (livre) a.colega = livre;
      else { a.trocaColega = `Colegas aptos já com ${N.maxAprendizes} aprendizes`; a.X = a.alternativa; aplicarIV(a); }
    }
    const custoEf = IV[a.X].compartilhado && pagos.has(a.X) ? 0 : a.custo;   // [v2-12]
    const consomeVaga = a.X !== 'PRES';                                         // [v2-5]
    const cabeH = usoH + a.horas <= N.horas + EPS;
    const cabeC = usoC + custoEf <= N.orcamento + EPS;
    const cabeN = !consomeVaga || usoN < N.maxAcoes;
    const admitida = negOK && cabeH && cabeC && cabeN;
    a.justificativa = justificar(a);
    const motivo = admitida ? a.justificativa
      : !cabeH ? 'Horas semanais insuficientes' : !cabeC ? 'Orçamento insuficiente' : 'Limite de ações simultâneas';
    if (admitida) {
      usoH += a.horas; usoC += custoEf; if (consomeVaga) usoN++;
      if (IV[a.X].compartilhado) pagos.add(a.X);
      if (a.X === 'PARES') carga[up(a.colega.id)] = (carga[up(a.colega.id)] || 0) + 1;
    }
    a.custoEfetivo = custoEf;
    const prazo = !admitida ? 'Próximo ciclo' : a.X === 'CULT' ? 'Preparação cultural' : a.semanas <= 4 ? '0-30 dias' : '31-90 dias';
    return { ordem: i + 1, d: a, admitida, motivo, prazo, saldo: (N.horas || 0) - usoH };
  });

  function justificar(a) {
    if (a.X === 'CULT') return a.apoioExterno ? 'Sem colega com prontidão moderada ou alta: preparação com apoio externo'
      : a.grupo ? 'Conversa em grupo; reaplicar a autoavaliação antes do treino' : 'Preparar e reaplicar prontidão antes do treino';
    if (a.X === 'PRES') return 'Preservar competência mesmo sem lacuna';
    if (a.X === 'MAT') return 'Elevar a maturidade digital (foco: ' + a.foco.join(', ') + ')';
    if (a.X === 'EXT') return 'Sem colega apto na loja: buscar apoio externo (fornecedor, curso, Sebrae)';
    if (a.X === 'PARES') return a.colega ? 'Combinar agenda com ' + a.colega.nome : 'Escolher colega nível 3 e combinar agenda';
    if (a.metaGradual) return 'Meta gradual limitada pela maturidade';
    return 'Desenvolver a lacuna com recursos existentes';
  }

  // devolve a ação de cada diagnóstico (para a tela de Diagnóstico)
  for (const d of diags.filter(d => d.ok)) {
    const a = acoes.find(x => x.ids.includes(d.id));
    if (a) Object.assign(d, { X: a.X, acao: a.id, intervencao: a.intervencao, horas: a.horas, semanas: a.semanas, custo: a.custo });
    d.justificativa = d.andamento === 'Concluída' ? 'Atualizar nível e evidência na reavaliação'
      : !d.ativa ? 'Tarefa inativa'
      : d.classe === 'Humana' ? 'Manter responsabilidade humana'
      : a ? a.justificativa + (a.ids.length > 1 ? ` (ação ${a.id}, junto com ${a.ids.filter(x => x !== d.id).join(', ')})` : '')
      : d.nec === 'CULT' ? 'Aguardando reavaliação da prontidão'
      : d.bloqueadoMat ? `Bloqueado pela maturidade digital (lacuna futura ${d.lacunaFutura})`
      : 'Sem lacuna no ciclo';
  }

  const pend = {
    negocio: negErros.length,
    equipe: equipe.filter(p => !p.vazio && !p.ok).length,
    tarefas: tarefas.filter(t => !t.vazio && !t.ok).length,
    diagnosticos: diags.filter(d => !d.vazio && !d.ok).length
  };
  const temPend = pend.negocio + pend.equipe + pend.tarefas + pend.diagnosticos > 0;
  const noCiclo = plano.filter(x => x.admitida).length;
  const adiadas = plano.length - noCiclo;

  // [v2-7] pontos de atenção
  const alertas = [];
  for (const p of plano.filter(p => p.d.X === 'CULT' && p.d.apoioExterno))
    alertas.push(`Preparação cultural de ${p.d.pessoaNome}: não há colega com prontidão moderada ou alta para conduzir; buscar apoio externo.`);
  const ext = plano.filter(p => p.d.X === 'EXT');
  if (ext.length) alertas.push(`Apoio externo necessário para ${ext.map(p => p.d.pessoaNome).join(', ')}: ninguém na loja tem nível 3 e a mentoria por IA não é indicada.`);
  if (aguardando.length) alertas.push(`Reaplicar a autoavaliação de ${aguardando.map(a => a.pessoaNome).join(', ')}: preparação cultural concluída.`);

  const soPres = plano.length > 0 && plano.every(p => p.d.X === 'PRES');
  const situacao = temPend ? { tipo: 'erro', texto: 'Há entradas pendentes: corrija os campos sinalizados antes de usar o plano.' }   // Plano!A7
    : plano.length === 0 ? { tipo: 'aviso', texto: aguardando.length ? alertas[alertas.length - 1] : 'Sem ações: confira tarefas ativas, lacunas, risco e ações concluídas.' }
    : N.horas === 0 ? { tipo: 'aviso', texto: 'Sem horas disponíveis: negociar tempo para capacitação.' }
    : adiadas > 0 ? { tipo: 'aviso', texto: 'Há ações adiadas: confira horas, orçamento e limite simultâneo.' }
    : alertas.length ? { tipo: 'aviso', texto: 'Plano calculado, com pontos de atenção: ' + alertas.join(' ') }
    : soPres ? { tipo: 'ok', texto: 'Equipe sem lacunas no ciclo: manter a preservação nas tarefas de risco alto.' }
    : { tipo: 'ok', texto: 'Plano calculado. Confirmar agenda e participação com a equipe.' };

  return {
    negErros, negOK, matMedia, teto, reavaliacao: addDays(N.dataBase, 90),
    equipe, tarefas, diags, plano, pend, situacao, alertas, aguardando,
    resumo: { noCiclo, adiadas, horas: usoH, custo: usoC, vagas: usoN, necessarias: plano.length }
  };
}

// [v2-4] registrar andamento de uma ação do plano (usado pela tela e pelos testes)
function concluirAcao(S, a, valor) {
  if (a.X === 'CULT') a.pessoas.forEach(id => { const p = S.equipe.find(x => up(x.id) === up(id)); if (p) p.prep = valor === 'Não iniciada' ? '' : valor; });
  else if (a.X === 'MAT') S.negocio.matAndamento = valor;
  else S.diagnosticos.filter(d => a.ids.includes(d.id)).forEach(d => d.andamento = valor);
}
// [v2-4] nova autoavaliação reabre o ciclo de preparação da pessoa
function aplicarAutoavaliacao(p, res) {
  p.prontidao = res.prontidao;
  p.c = COMPS.map(c => res.competencias[c[0]]);

}

const PERGUNTAS = [
  'Consigo aprender a usar uma ferramenta de IA com orientação.',
  'Consigo reconhecer quando preciso de ajuda ao usar IA.',
  'Minha liderança oferece apoio para aprender novas formas de trabalho.',

  'A possibilidade de usar IA no trabalho me deixa ansioso(a).',

  'Estou disposto(a) a testar novas formas de realizar minhas tarefas.',
  'Estou disposto(a) a aprender com colegas e compartilhar o que aprendo.'
];
function calcularAutoavaliacao(id, skills, answers, low = 1, high = 2, simulated = false) {
  if (!String(id).trim() || skills.length !== 6 || answers.length !== 8) throw new Error('Preencha o código, as 6 competências e as 8 perguntas.');
  if (![...skills, ...answers].every(x => Number.isInteger(x) && x >= 0 && x <= 3)) throw new Error('Cada resposta deve ser um número inteiro entre 0 e 3.');
  if (!Number.isFinite(low) || !Number.isFinite(high) || low < 0 || high > 3 || high <= low) throw new Error('Os limites devem satisfazer 0 ≤ baixa < alta ≤ 3.');
  const avg = answers.reduce((s, x, i) => s + ([4, 5].includes(i) ? 3 - x : x), 0) / 8;   // itens 5 e 6 invertidos
  let band = avg < low ? 'Baixa' : avg < high ? 'Moderada' : 'Alta';
  // [v2-11] medo e ansiedade no máximo: faixa baixa; um dos dois no máximo: no máximo moderada
  if (answers[4] === 3 && answers[5] === 3) band = 'Baixa';
  else if ((answers[4] === 3 || answers[5] === 3) && band === 'Alta') band = 'Moderada';
  const alertas = answers.every(x => x === answers[0]) ? ['Todas as respostas de prontidão iguais: confirmar a faixa em conversa.'] : [];
  return {
    versao: '2.0', codigo: String(id).trim(), origem: simulated ? 'Demonstração simulada' : 'Autoavaliação individual',
    prontidao: band, competencias: Object.fromEntries(COMPS.map((c, i) => [c[0], skills[i]])),
    limites: { baixa_menor_que: low, alta_a_partir_de: high }, alertas
  };
}

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = x => isNum(x) ? x.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) : '—';
const fmtH = x => isNum(x) ? fmtN(x) + ' h' : '—';
const fmtR = x => isNum(x) ? x.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '—';
const fmtD = iso => iso ? iso.split('-').reverse().join('/') : '—';
const hoje = () => new Date().toISOString().slice(0, 10);
const plural = (n, um, varios) => n === 1 ? `1 ${um}` : `${n} ${varios}`;

const V = {};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 4200);
}
function baixar(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = h('a', { href: url, download: nome, hidden: true });
  document.body.append(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
}
function abrirArquivo(accept, cb) {
  const inp = h('input', { type: 'file', accept, hidden: true });
  inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { cb(r.result, f.name); } catch (e) { toast(e.message); } inp.remove(); };
    r.readAsText(f, 'utf-8');
  });
  document.body.append(inp); inp.click();
}

function escolha(opcoes, valor, aoMudar, { cols = false, nome } = {}) {
  const grupo = nome || 'g' + uid();
  const wrap = h('div', { class: 'choices' + (cols ? ' cols' : ''), role: 'radiogroup' });

    inp.addEventListener('change', () => aoMudar(v));
    wrap.append(h('label', { class: 'choice' }, inp, h('span', {}, rot, desc ? h('small', {}, desc) : null)));
  }
  return wrap;
}
const simNao = (valor, aoMudar) => escolha([['Sim', 'Sim'], ['Não', 'Não']], valor, aoMudar);

// Contador com botões − e +
function contador(valor, aoMudar, { passo = 1, min = 0, max = 9999, unidade = '', rotulo } = {}) {
  const inp = h('input', { type: 'number', inputmode: 'decimal', value: valor ?? '', min, max, step: passo, 'aria-label': rotulo });
  const definir = v => {
    v = Math.min(max, Math.max(min, Math.round(v / passo) * passo));
    inp.value = v; aoMudar(v);
  };
  inp.addEventListener('input', () => { const t = inp.value.replace(',', '.'); if (t === '') return aoMudar(null); const n = Number(t); if (Number.isFinite(n)) aoMudar(n); });
  inp.addEventListener('blur', () => { if (inp.value !== '') definir(Number(inp.value)); });
  return h('div', { class: 'stepper' },
    h('button', { type: 'button', 'aria-label': 'Diminuir', onclick: () => definir((Number(inp.value) || 0) - passo) }, '−'),
    inp,
    unidade ? h('span', { class: 'unit' }, unidade) : null,
    h('button', { type: 'button', 'aria-label': 'Aumentar', onclick: () => definir((Number(inp.value) || 0) + passo) }, '+'));
}

// Janela (dialog). conteudo(corpo, rodape) monta o miolo; acoes = [{texto, classe, aoClicar}] onde aoClicar devolve true para fechar.
function janela({ titulo, subtitulo, montar, botaoOk = 'Salvar', aoConfirmar, larga }) {

  } }, botaoOk);
  const rodape = h('div', { class: 'dlg-foot' }, msg, h('button', { class: 'btn light', type: 'button', onclick: fechar }, 'Cancelar'), aoConfirmar ? ok : null);
  dlg.append(h('div', { class: 'dlg' },
    h('div', { class: 'dlg-head' }, h('div', {}, h('h2', {}, titulo), subtitulo ? h('p', {}, subtitulo) : null),
      h('button', { class: 'dlg-x', type: 'button', 'aria-label': 'Fechar', onclick: fechar }, '×')),
    corpo, rodape));

  montar(corpo, api);
  dlg.showModal();
  corpo.scrollTop = 0;
  return api;
}

// formulario.js
// Autoavaliação individual: competências atuais e prontidão para a mudança.
// É usado de dois jeitos: dentro da tela do gerente e no arquivo entregue a cada pessoa.

function questionario({ nome, pedirNome = false, voce = false, low = 1, high = 2, exemplo = false, onMudou }) {
  const resp = { nome: nome || '', skills: Array(6).fill(null), answers: Array(8).fill(null) };
  const blocos = { skills: [], answers: [] };
  const el = h('div');
  const mudou = () => onMudou && onMudou();

  if (pedirNome) {
    const nomeIn = texto('', v => { resp.nome = v; mudou(); }, { placeholder: 'Ex.: Bruno' });
    put(el, h('div', { class: 'block' }, campo('Seu nome', nomeIn, 'Use o mesmo nome cadastrado na Equipe. Evite outros dados pessoais.')));
    blocos.nome = nomeIn;
  }

  const parte1 = h('div', { class: 'block' }, h('h2', {}, 'Competências atuais'),
    h('p', { class: 'lead' }, '0 = não utiliza · 1 = executa com apoio · 2 = executa com autonomia · 3 = executa e ensina colegas.'));
  COMPS.forEach((c, i) => {
    const [titulo, desc] = HABILIDADES[c[0]];
    const f = campo(titulo, escolha(NIVEIS_TXT.map((n, j) => [j, n[0], n[1]]), null, v => { resp.skills[i] = v; f.classList.remove('missing'); mudou(); }, { cols: true }), desc);
    blocos.skills.push(f); put(parte1, f);
  });

  const parte2 = h('div', { class: 'block' }, h('h2', {}, 'Prontidão para a mudança'),
    h('p', { class: 'lead' }, '0 = discordo totalmente · 1 = discordo · 2 = concordo · 3 = concordo totalmente. Os itens sobre ansiedade têm pontuação invertida. Instrumento experimental de apoio à conversa, sem validação psicométrica.'));
  PERGUNTAS.forEach((q, i) => {
    const f = campo(q, escolha(QUESTIONARIO_ESCALA.map((t, j) => [j, t]), null, v => { resp.answers[i] = v; f.classList.remove('missing'); mudou(); }));
    blocos.answers.push(f); put(parte2, f);
  });
  put(el, parte1, parte2);

  if (exemplo) el.prepend(h('p', { class: 'small' }, h('button', { class: 'btn quiet', type: 'button', onclick: () => {
    // respostas fictícias do Bruno (cenário Mercado Aurora)
    const marcar = (lista, valores) => lista.forEach((f, i) => { const r = f.querySelector(`input[value="${valores[i]}"]`); r.checked = true; r.dispatchEvent(new Event('change')); });
    marcar(blocos.skills, [0, 1, 1, 3, 1, 0]); marcar(blocos.answers, [0, 1, 1, 1, 3, 3, 1, 0]);
  } }, 'Preencher exemplo de Bruno')));

  return {
    el,
    // devolve o resultado ou lança erro explicando o que falta, destacando a primeira pergunta sem resposta
    resultado(codigo) {
      const nomeFinal = (resp.nome || '').trim();
      if (pedirNome && !nomeFinal) { blocos.nome.classList.add('bad'); blocos.nome.focus(); throw new Error('Preencha o nome.'); }
      const faltando = [...blocos.skills.filter((f, i) => resp.skills[i] === null), ...blocos.answers.filter((f, i) => resp.answers[i] === null)];
      faltando.forEach(f => f.classList.add('missing'));
      if (faltando.length) { faltando[0].scrollIntoView({ behavior: 'smooth', block: 'center' }); throw new Error('Responda todos os itens antes de gerar o resultado.'); }
      const r = calcularAutoavaliacao(codigo || nomeFinal, resp.skills, resp.answers, low, high, exemplo && resp.skills.join() === '0,1,1,3,1,0');
      r.nome = nomeFinal || nome || '';
      return r;
    }
  };
}

// Quadro com o resultado (não mostra as 8 respostas individuais)
function quadroResultado(r, voce = false) {
  const [faixa, explica] = PRONTIDAO_TXT[r.prontidao];
  return h('div', {},
    h('p', { class: 'muted', style: 'margin:0' }, 'Resultado para compartilhar' + (r.nome ? ' · ' + r.nome : '')),
    h('p', { class: 'result-band' }, faixa),
    h('p', { style: 'margin-top:0' }, explica),
    (r.alertas || []).map(a => h('p', { class: 'status info', style: 'margin:8px 0' }, a)),
    h('div', { class: 'skills block', style: 'padding:16px 18px;margin:12px 0' },
      COMPS.map(c => h('div', {}, h('span', {}, HABILIDADES[c[0]][0]), h('span', {}, NIVEIS_TXT[r.competencias[c[0]]][0], ' ', bolinhas(r.competencias[c[0]]))))),
    h('p', { class: 'small muted' }, 'Respostas individuais de prontidão não são incluídas no resultado nem na impressão.'));
}

// ---------- arquivo entregue a cada pessoa ----------
function montarColaborador() {
  const ds = document.documentElement.dataset;
  const nome = ds.nome || '';
  const low = Number(ds.low ?? 1), high = Number(ds.high ?? 2);
  document.title = 'Autoavaliação individual' + (nome ? ' · ' + nome : '');
  const q = questionario({ nome, pedirNome: !nome, voce: true, low, high });
  const saida = h('div');
  const botao = h('button', { class: 'btn big', type: 'button', onclick: () => {
    aviso.textContent = '';
    let r;
    try { r = q.resultado(ds.codigo); } catch (e) { aviso.textContent = e.message; return; }
    const arquivo = `Resposta_${nomeArquivo(r.nome || r.codigo)}.json`;
    saida.replaceChildren(h('div', { class: 'block', style: 'border:2px solid var(--green)' },
      h('h2', {}, 'Resultado gerado'),
      h('p', { class: 'lead' }, 'Baixe o resultado e entregue o arquivo à liderança. O arquivo contém o código, a faixa de prontidão e os níveis de competências.'),
      h('div', { class: 'actions' }, h('button', { class: 'btn big', type: 'button', onclick: () => {
        baixar(arquivo, JSON.stringify(r, null, 2), 'application/json;charset=utf-8');
        toast(`Resultado salvo como “${arquivo}”.`);
      } }, 'Baixar resultado (.json)')),
      h('p', { class: 'small muted' }, `Arquivo: “${arquivo}”.`),
      h('hr', { style: 'border:0;border-top:1px dashed var(--line);margin:18px 0' }),
      quadroResultado(r, true),
      h('p', { class: 'small muted' }, 'Se o navegador não baixar arquivos, mostre esta tela à liderança para transcrição. Ao concluir, feche a página.')));
    saida.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } }, 'Gerar meu resultado');
  const aviso = h('p', { role: 'alert', style: 'color:var(--alert);font-weight:700' });
  document.getElementById('root').append(h('div', { class: 'solo' },
    cabecalho('Como você se prepara para trabalhar com IA?', (nome ? (ds.codigo ? ds.codigo + ' · ' : '') + nome + '. ' : '') + 'Uma autoavaliação para orientar aprendizagem e conversar sobre a mudança no pequeno varejo.'),
    h('div', { class: 'privacy' }, 'As respostas de prontidão são processadas apenas nesta página. O arquivo de resultado contém seu código, a faixa de prontidão e os níveis de competências. Não inclui as oito respostas individuais.'),
    q.el, aviso, botao, saida));
}

montarColaborador();
